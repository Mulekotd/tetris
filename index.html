<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Tetris</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Loading Screen -->
    <div id="loading-screen" class="loading-screen">
      <div class="spinner"></div>
      <div class="loading-text">Loading...</div>
    </div>

    <!-- Game Container -->
    <div id="game-container" class="game-container hidden">
      <!-- Mobile Top Panel (Next Piece + Score side by side) -->
      <div class="mobile-top-panel">
        <div class="panel-box panel-box-compact">
          <h2>Next</h2>
          <canvas id="next-piece-canvas-mobile" width="80" height="60"></canvas>
        </div>
        <div class="panel-box panel-box-compact">
          <h2>Score</h2>
          <div class="score-value" id="score-display-mobile">0</div>
          <div class="mobile-stats">
            <span>L: <span id="lines-display-mobile">0</span></span>
            <span>Lv: <span id="level-display-mobile">1</span></span>
          </div>
        </div>
      </div>

      <div class="canvas-wrapper">
        <canvas id="game-layer"></canvas>
        <div id="game-overlay" class="overlay">
          <div class="overlay-content">
            <h1>TETRIS</h1>
            <p>Click Start to begin playing</p>
            <button id="start-button" class="button">START GAME</button>
          </div>
        </div>
      </div>

      <!-- Mobile Controls Info -->
      <div class="mobile-controls-info">
        <span>Tap: Rotate</span>
        <span>Hold: Drop</span>
        <span>2x Tap: Hard Drop</span>
        <span>Swipe: Move</span>
      </div>

      <div class="side-panel">
        <div class="panel-box">
          <h2>Next Piece</h2>
          <canvas id="next-piece-canvas" width="160" height="100"></canvas>
        </div>

        <div class="panel-box">
          <h2>Score</h2>
          <div class="score-value" id="score-display">0</div>
          <div class="score-label">points</div>

          <div class="stats-grid">
            <div class="stat-item">
              <div class="stat-label">Lines</div>
              <div class="stat-value" id="lines-display">0</div>
            </div>
            <div class="stat-item">
              <div class="stat-label">Level</div>
              <div class="stat-value" id="level-display">1</div>
            </div>
          </div>
        </div>

        <div class="controls-box">
          <h2>Controls</h2>
          <div class="controls-content">
            <div>
              <div class="control-item">
                <span class="control-key">↑</span>
                <span class="control-action">Rotate</span>
              </div>
              <div class="control-item">
                <span class="control-key">← →</span>
                <span class="control-action">Move</span>
              </div>
              <div class="control-item">
                <span class="control-key">↓</span>
                <span class="control-action">Soft Drop</span>
              </div>
              <div class="control-item">
                <span class="control-key">SPACE</span>
                <span class="control-action">Hard Drop</span>
              </div>
              <div class="control-item">
                <span class="control-key">R</span>
                <span class="control-action">Restart</span>
              </div>
              <div class="control-item">
                <span class="control-key">P</span>
                <span class="control-action">Pause</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
